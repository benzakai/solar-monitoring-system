<h2 mat-dialog-title>{{data.confirmText}}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions>

  @if (displayCancel()) {
    <button mat-button (click)="onCancel()">{{ data.cancelText || 'Cancel' }}</button>
  }
  <button mat-button color="primary" (click)="onConfirm()">{{ data.confirmText || 'confirm' | translate }}</button>
</mat-dialog-actions>

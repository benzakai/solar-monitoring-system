<h2 mat-dialog-title>{{data.confirmText}}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions>

  <button mat-button (click)="onCancel()" *ngIf="displayCancel()">{{ data.cancelText || 'Cancel' }}</button>
  <button mat-button color="primary" (click)="onConfirm()">{{ data.confirmText || 'confirm' | translate }}</button>
</mat-dialog-actions>

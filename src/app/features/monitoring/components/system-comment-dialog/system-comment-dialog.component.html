<h2 mat-dialog-title>
  <button mat-icon-button mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
  @if (system | async; as sys) {
    <h1>{{ sys.name }}</h1>
  }
</h2>
<mat-dialog-content class="mat-typography">
  @if (people | async; as p) {
    <table mat-table [dataSource]="p">
      <ng-container matColumnDef="name">
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>
      <ng-container matColumnDef="position">
        <td mat-cell *matCellDef="let element; let idx = index">
          {{ idx === 0 ? 'לקוח' : element.position }}
        </td>
      </ng-container>
      <ng-container matColumnDef="phone">
        <td mat-cell *matCellDef="let element" class="link">
          <a class="link" [href]="'tel:' + element.phone">{{
            element.phone
          }}</a>
        </td>
      </ng-container>
      <ng-container matColumnDef="email" class="link">
        <td mat-cell *matCellDef="let element">
          <a class="link" [href]="'mailto:' + element.email">{{
            element.email
          }}</a>
        </td>
      </ng-container>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }

  @if (system | async; as sys) {
    <div class="form-line area">
      <mat-form-field appearance="outline">
        <textarea
          matInput
          placeholder="כתיבת הערה..."
          [formControl]="comment"
          >{{ sys.comments }}</textarea
        >
      </mat-form-field>
    </div>
  }
</mat-dialog-content>
<mat-dialog-actions>
  <button mat-flat-button color="warn" (click)="delete()" [disabled]="action | async">
    {{ 'remove_comment' | translate }}
    @if (deleting | async) {
      <mat-progress-spinner
        diameter="15"
        mode="indeterminate"
      ></mat-progress-spinner>
    }
  </button>
  <button
    mat-flat-button
    color="primary"
    (click)="save()"
    [disabled]="action | async"
  >
    {{ 'save_comment' | translate
    }}
    @if (updating | async) {
      <mat-progress-spinner
        diameter="15"
        mode="indeterminate"
      ></mat-progress-spinner>
    }
  </button>
</mat-dialog-actions>

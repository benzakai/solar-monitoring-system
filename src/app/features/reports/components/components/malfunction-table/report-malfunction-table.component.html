@if (!!malfunctions.length) {
<table>
  <thead>
  <tr>
    <th>תאריך פתיחה</th>
    <th>תאריך סגירה</th>
    <th>סוג תקלה</th>
    <th>סיכום</th>
  </tr>
  </thead>
  <tbody>
  @for (row of malfunctions; track row.id) {
    <tr>
      <td>{{row.openTime | date : 'd/M/yy' }}</td>
      <td>{{row.closeTime | date : 'd/M/yy'}}</td>
      <td>{{row.type?.join('')}}</td>
      <td>{{row.reportText}}</td>
    </tr>
  }
  </tbody>
</table>
}

@if (!!malfunctions.length) {
<table>
  <thead>
  <tr>
    <th>תאריך פתיחה</th>
    <th>תאריך סגירה</th>
    <th>סוג תקלה</th>
    <th>סיכום</th>
  </tr>
  </thead>
  <tbody>
  <tr *ngFor="let row of malfunctions">
    <td>{{row.openTime | date : 'short' }}</td>
    <td>{{row.closeTime | date : 'short'}}</td>
    <td>{{row.type?.join('')}}</td>
    <td>{{row.reportText}}</td>
  </tr>
  </tbody>
</table>
}

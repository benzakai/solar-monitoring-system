<h2 mat-dialog-title>{{'חיבור לפורטל (' + data?.type + ')'}}</h2>

<mat-dialog-content>
  <div class="app-input-field">

    @for (input of inputs; let i = $index; track input;) {
      @if (isRequired(i)) {
        <div class="form-line">
          <mat-form-field appearance="outline" color="accent">
            <input matInput
                   [name]="'API-input-' + i"
                   [formControl]="systemApi.at(i)"
            >
          </mat-form-field>
          <label>{{input}}</label>
        </div>
      }
    }
  </div>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button mat-dialog-close>ביטול</button>
  <button mat-flat-button color="primary"
          [mat-dialog-close]="systemApi.value"
          [disabled]="systemApi.invalid">
    אישור
  </button>
</mat-dialog-actions>

<h2 mat-dialog-title>
  <button mat-icon-button mat-dialog-close>
    <mat-icon>close</mat-icon>
  </button>
</h2>
<mat-dialog-content class="mat-typography">
  @if (people | async; as p) {
    <table mat-table [dataSource]="p">
      <ng-container matColumnDef="name">
        <td mat-cell *matCellDef="let element">{{ element.name }}</td>
      </ng-container>
      <ng-container matColumnDef="position">
        <td mat-cell *matCellDef="let element; let idx = index">
          {{ idx === 0 ? 'לקוח' : element.position }}
        </td>
      </ng-container>
      <ng-container matColumnDef="phone">
        <td mat-cell *matCellDef="let element" class="link">
          <a class="link" [href]="'tel:' + element.phone">{{
              element.phone
            }}</a>
        </td>
      </ng-container>
      <ng-container matColumnDef="email" class="link">
        <td mat-cell *matCellDef="let element">
          <a class="link" [href]="'mailto:' + element.email">{{
              element.email
            }}</a>
        </td>
      </ng-container>

      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }

</mat-dialog-content>

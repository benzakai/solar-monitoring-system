@if (loading$ | async) {
  <mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

@if (form; as fg) {
  <div class="card-body" [formGroup]="fg">
    <div class="distributions">
      <section>
        <p class="section-title">
          {{ 'settings.prediction.distributions.normal' | translate }}
        </p>
        <app-months-inputs [formArray]="normalDistribution" [allowDecimal]="2"></app-months-inputs>
      </section>

      <section>
        <p class="section-title">
          {{ 'settings.prediction.distributions.taoz' | translate }}
        </p>
        <app-months-inputs [formArray]="taozDistribution" [allowDecimal]="2"></app-months-inputs>
      </section>
    </div>

    <div class="fields">
      <div class="form-line prediction-field">
        <mat-form-field appearance="outline">
          <input matInput type="number" formControlName="DEFAULT_ANNUAL" min="0" step="0.01" />
        </mat-form-field>
        <label>{{ 'settings.prediction.fields.defaultAnnual' | translate }}</label>
      </div>

      <div class="form-line prediction-field">
        <mat-form-field appearance="outline">
          <span matPrefix>%&nbsp;</span>
          <input matInput type="number" formControlName="TRACKER_FACTOR" min="0" step="0.1" />
        </mat-form-field>
        <label>{{ 'settings.prediction.fields.trackerFactor' | translate }}</label>
      </div>

      <div class="form-line prediction-field">
        <mat-form-field appearance="outline">
          <span matPrefix>%&nbsp;</span>
          <input matInput type="number" formControlName="AUTO_WASH_FACTOR" min="0" step="0.1" />
        </mat-form-field>
        <label>{{ 'settings.prediction.fields.autoWashFactor' | translate }}</label>
      </div>

      <div class="form-line prediction-field">
        <mat-form-field appearance="outline">
          <span matPrefix>%&nbsp;</span>
          <input matInput type="number" formControlName="AZIMUTH_FACTOR" min="0" max="100" step="0.1" />
        </mat-form-field>
        <label>{{ 'settings.prediction.fields.azimuthFactor' | translate }}</label>
      </div>

      <div class="form-line prediction-field">
        <mat-form-field appearance="outline">
          <span matPrefix>%&nbsp;</span>
          <input matInput type="number" formControlName="AGE_FACTOR" min="0" max="100" step="0.1" />
        </mat-form-field>
        <label>{{ 'settings.prediction.fields.ageFactor' | translate }}</label>
      </div>
    </div>

    @if (distributionError) {
      <p class="error">
        {{ distributionError }}
      </p>
    }
  </div>

  <div class="card-actions">
    <button
      mat-flat-button
      color="primary"
      (click)="save()"
      [disabled]="fg.invalid || saving"
    >
      {{ 'settings.prediction.actions.save' | translate }}
    </button>
  </div>
} @else {
  <div class="skeleton"></div>
}
